<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hero turntable</title>
<style>html,body{margin:0;background:#8fa6bd;overflow:hidden}canvas{display:block}#l{position:fixed;left:8px;top:6px;font:13px system-ui;color:#fff;text-shadow:0 1px 2px #000}</style>
</head>
<body>
<div id="l"></div>
<script type="module">
// QA page for the hero aircraft (tools/hero/luftwaffe/README.md): four views of one model with sun + sky light.
//   /tools/hero/luftwaffe/turntable.html?kind=bf109&lod=0&ace=1&yaw=0.6&gear=0&close=1&ktx2=1
// ktx2=1 swaps the embedded WebP maps for <kind>_{base,normal,orm}.ktx2, as the game does.
// lod: 0/1/2 shows only that level of the *_lodN children (old FlightGear models have none).
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { KTX2Loader } from 'three/examples/jsm/loaders/KTX2Loader.js';

const q = new URLSearchParams(location.search);
const kind = q.get('kind') ?? 'bf109';
const lod = Number(q.get('lod') ?? 0);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fa6bd);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const sun = new THREE.DirectionalLight(0xfff1dc, 3.2);
sun.position.set(6, 10, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera; sc.left = sc.bottom = -14; sc.right = sc.top = 14; sc.near = 0.1; sc.far = 60;
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02;
scene.add(sun, new THREE.HemisphereLight(0xbfd4ee, 0x4a4436, 0.6));

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const gltf = await loader.loadAsync(`/models/${kind}.glb?v=${Date.now()}`);
const root = gltf.scene;
let tris = 0;
root.traverse((o) => {
  const m = /_lod(\d)$/i.exec(o.name);
  if (m) o.visible = Number(m[1]) === lod;
  if (/^gear_/.test(o.name)) o.visible = q.get('gear') === '1';
  if (o.isMesh) {
    o.castShadow = o.receiveShadow = true;
    const mat = o.material;
    if (mat.map) mat.map.anisotropy = 8;
    if (mat.transparent) o.castShadow = false;
  }
});
let ktxInfo = null;
if (q.get('ktx2') === '1') {
  const kl = new KTX2Loader().setTranscoderPath('/models/basis/').detectSupport(renderer);
  const ld = async (n, srgb) => { const t = await kl.loadAsync(`/models/${kind}_${n}.ktx2`); t.flipY = false; t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.anisotropy = 8; return t; };
  const [b, nm, orm] = await Promise.all([ld('base', true), ld('normal', false), ld('orm', false)]);
  root.traverse((o) => { if (o.isMesh && o.material.name === `hero_${kind}`) { const m = o.material; m.map = b; m.normalMap = nm; m.roughnessMap = m.metalnessMap = m.aoMap = orm; } });
  ktxInfo = { format: b.format, mips: b.mipmaps.length };
}
if (q.get('ace') === '1') {
  const tex = await new THREE.TextureLoader().loadAsync(`/models/${kind}_ace.webp`);
  tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  root.traverse((o) => { if (o.isMesh && o.material.name === `hero_${kind}`) { o.material = o.material.clone(); o.material.map = tex; } });
}
scene.add(root);
root.updateMatrixWorld(true);
const box = new THREE.Box3();
root.traverse((o) => { if (o.isMesh && o.visible && o.parent?.visible !== false) { let v = true; for (let p = o; p; p = p.parent) v &&= p.visible; if (v) { box.expandByObject(o); tris += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3; } } });
const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
const R = Math.max(size.x, size.z) * 0.62;
const close = q.get('close') === '1';
// views: [yaw (around +Y from the nose), elevation, distance factor, target offset]
const views = close
  ? [[0.55, 0.12, 0.42, [0, 0.4, -0.6]], [-0.9, 0.35, 0.45, [0, 0.3, 1.2]], [2.4, 0.2, 0.5, [0, 0.4, -3.5]], [1.57, -0.35, 0.55, [2.0, -0.4, 0]]]
  : [[1.57, 0.05, 1.0], [0.75, 0.32, 1.05], [-2.35, -0.22, 1.05], [0.2, 1.15, 1.1]];
const cam = new THREE.PerspectiveCamera(32, (W / 2) / (H / 2), 0.05, 400);
if (q.get('pilot') === '1') {
  // the pilot figure close up (glass hidden): front-left, slightly above the eye
  const eye = new THREE.Vector3();
  root.getObjectByName('eye_pilot').getWorldPosition(eye);
  root.traverse((o) => { if (o.name === 'glass') o.visible = false; });
  renderer.setViewport(0, 0, W, H);
  cam.aspect = W / H; cam.fov = 30; cam.updateProjectionMatrix();
  const views2 = [[0.95, 0.35, 1.05], [-0.7, 0.25, 1.0]];
  renderer.setScissorTest(true);
  views2.forEach(([dx, dy, dz], i) => {
    renderer.setViewport(i * W / 2, 0, W / 2, H); renderer.setScissor(i * W / 2, 0, W / 2, H);
    cam.aspect = (W / 2) / H; cam.updateProjectionMatrix();
    cam.position.set(eye.x + dx, eye.y + dy, eye.z + dz); cam.lookAt(eye.x, eye.y - 0.18, eye.z);
    renderer.render(scene, cam);
  });
  document.getElementById('l').textContent = `${kind} pilot`;
  window.ready = { tris: Math.round(tris), size: size.toArray(), ktx2: ktxInfo };

} else if (q.get('cam')) {
  // one full-frame view: ?cam=x,y,z&at=x,y,z (model metres, +Z nose, +X left wing)
  const c = q.get('cam').split(',').map(Number), a = (q.get('at') ?? '0,0,0').split(',').map(Number);
  cam.aspect = W / H; cam.fov = Number(q.get('fov') ?? 30); cam.updateProjectionMatrix();
  cam.position.set(c[0], c[1], c[2]); cam.lookAt(a[0], a[1], a[2]);
  renderer.render(scene, cam);
  document.getElementById('l').textContent = `${kind} lod${lod}`;
  window.ready = { tris: Math.round(tris), size: size.toArray(), ktx2: ktxInfo };
} else {
renderer.setScissorTest(true);
const yaw0 = Number(q.get('yaw') ?? 0);
views.forEach(([yaw, el, k, off], i) => {
  const x = (i % 2) * W / 2, y = (1 - Math.floor(i / 2)) * H / 2;
  renderer.setViewport(x, y, W / 2, H / 2);
  renderer.setScissor(x, y, W / 2, H / 2);
  const d = R * 1.85 * k;
  const t = ctr.clone().add(new THREE.Vector3(...(off ?? [0, 0, 0])));
  cam.position.set(t.x + d * Math.cos(el) * Math.sin(yaw + yaw0), t.y + d * Math.sin(el), t.z + d * Math.cos(el) * Math.cos(yaw + yaw0));
  cam.lookAt(t);
  renderer.render(scene, cam);
});
document.getElementById('l').textContent = `${kind} lod${lod} ${Math.round(tris)} tris${q.get('ace') === '1' ? ' (ace)' : ''}${ktxInfo ? ' (KTX2)' : ''}`;
window.ready = { tris: Math.round(tris), size: size.toArray(), ktx2: ktxInfo };
}
</script>
</body>
</html>
