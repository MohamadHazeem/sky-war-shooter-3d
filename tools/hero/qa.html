<!doctype html><html><head><meta charset="utf-8"><title>B-17 asset QA</title><style>body{margin:0;background:#19202a;color:white;font:14px sans-serif}button{margin:8px;padding:10px}iframe{width:1280px;height:720px;border:0;display:block}pre{white-space:pre-wrap}</style></head><body>
<button id="before">Capture before</button><button id="after">Capture after</button><button id="low">Capture Low</button><button id="verify">Verify mechanics and LODs</button><pre id="status">Waiting for game…</pre><iframe src="/"></iframe>
<script type="module">
const frame=document.querySelector('iframe'), status=document.querySelector('#status');
const shown=o=>{for(let p=o;p;p=p.parent)if(!p.visible)return false;return true;};
let sws;const ready=setInterval(()=>{sws=frame.contentWindow.sws;if(sws?.vqa){clearInterval(ready);sws.vqa.freeze();status.textContent='Ready';}},500);
async function capture(label,quality){try {sws.vqa.freeze();sws.vqa.quality(quality);const stats={};for(const shot of ['formation','waist']){sws.gallery.setup(shot);await sws.vqa.save(`${label}-${shot}.jpg`,5303);stats[shot]=sws.vqa.scan();}sws.gallery.setup('formation');const b=sws.game.world.playerBomber;const V=sws.vqa.THREE.Vector3;sws.vqa.look(b.localToWorld(new V(25,11,29)),b.localToWorld(new V(0,0,-3)),46);await sws.vqa.save(`${label}-beauty.jpg`,5303);stats.perf=sws.bench(60);stats.meshes={lods:0,levels:[0,0,0],triangles:0};b.model.traverse(o=>{if(o.isLOD&&shown(o)){stats.meshes.lods++;o.levels.forEach((l,i)=>{if(l.object.visible)stats.meshes.levels[i]++;});}if(o.isMesh){let visible=true;for(let p=o;p;p=p.parent)visible&&=p.visible;if(visible)stats.meshes.triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;}});await fetch(`http://localhost:5303/save?file=${label}-stats.json`,{method:'POST',body:JSON.stringify(stats,null,2)});status.textContent=JSON.stringify(stats,null,2);}catch(e){status.textContent=String(e.stack);}}
document.querySelector('#verify').onclick=async()=>{try{
  sws.vqa.quality('high');sws.gallery.setup('formation');const b=sws.game.world.playerBomber;const V=sws.vqa.THREE.Vector3;
  b.controls.setGear(0);b.controls.update(2,true);b.engineDead[0]=true;b.updateProps(.1);sws.vqa.look(b.localToWorld(new V(19,-10,22)),b.localToWorld(new V(0,0,-3)),48);
  await sws.vqa.save('mechanics.jpg',5303);
  const verify={hero:!!b.model.getObjectByName('B17G_HERO'),props:b.props.length,propAxis:b.props[0].node.getWorldDirection(new V()).toArray(),bay:b.model.getObjectByName('bomb_bay_L').rotation.z,gear:b.model.getObjectByName('gear_L').rotation.x,deadDisc:b.props[0].disc.visible,runningDisc:b.props[1].disc.visible};
  b.controls.setGear(1);b.controls.update(10,false);b.engineDead[0]=false;b.updateProps(.1);
  sws.vqa.quality('high');sws.gallery.setup('formation');const ship=sws.game.world.playerBomber;sws.vqa.look(ship.localToWorld(new V(60,20,20)),ship.pos,50,12);const programIds=new Set(sws.engine.renderer.info.programs.map(p=>p.id));const programs=sws.engine.renderer.info.programs.length;for(const distance of [60,300,900,60])sws.vqa.look(ship.localToWorld(new V(distance,20,20)),ship.pos,50,12);verify.programsBefore=programs;verify.programsAfter=sws.engine.renderer.info.programs.length;verify.newPrograms=sws.engine.renderer.info.programs.filter(p=>!programIds.has(p.id)).map(p=>({id:p.id,name:p.name}));verify.owners=[];sws.engine.scene.traverse(o=>{if(!o.isMesh)return;for(const m of Array.isArray(o.material)?o.material:[o.material]){const cached=sws.engine.renderer.properties.get(m).programs;if(cached)for(const p of cached.values())if(!programIds.has(p.id)){const item={mesh:o.parent?.name,material:m.name,type:m.type,program:p.id};if(!verify.owners.some(x=>JSON.stringify(x)===JSON.stringify(item)))verify.owners.push(item);}}});
  const cam=sws.engine.camera;verify.lods=[];
  for(const [quality,distance] of [['high',60],['high',300],['high',900],['low',60]]){sws.vqa.quality(quality);sws.vqa.look(ship.localToWorld(new V(distance,20,20)),ship.pos,50,2);let levels=[0,0,0];ship.model.traverse(o=>{if(o.isLOD&&shown(o))o.levels.forEach((l,i)=>{if(l.object.visible)levels[i]++;});});verify.lods.push({quality,distance,levels});}

  status.textContent=JSON.stringify(verify,null,2);await fetch('http://localhost:5303/save?file=mechanics-stats.json',{method:'POST',body:JSON.stringify(verify,null,2)});
}catch(e){status.textContent=String(e.stack);}};
document.querySelector('#before').onclick=()=>capture('before','high');document.querySelector('#after').onclick=()=>capture('after','high');document.querySelector('#low').onclick=()=>capture('low','low');
</script></body></html>
