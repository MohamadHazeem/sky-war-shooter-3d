name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Fast CI: node_modules cached on the lockfile; typecheck+build and three test shards run in parallel.
jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - id: nm
        uses: actions/cache@v4
        with: { path: node_modules, key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }} }
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build --logLevel error
  test:
    name: Unit tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3] }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - id: nm
        uses: actions/cache@v4
        with: { path: node_modules, key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }} }
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3
